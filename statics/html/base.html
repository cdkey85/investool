{{ define "header" }}
<!DOCTYPE html>
<html lang="zh-cmn-Hans">
    <head>
        <meta charset="UTF-8" />
        <meta name="keywords" content="InvesTool,投资工具,财报分析,股票基本面分析,基本面选股,基金检测,基金筛选,4433法则,飙股在线等" />
        <meta name="description" content="InvesTool是一个用于股票基金投资分析的辅助工具网站，主要提供公司财报分析，股票基本面分析，基本面选股，基金经理排行榜，基金4433法则筛选，基金排行榜等功能。" />
        <meta name="author" content="axiaoxin" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1, minimum-scale=1.0, maximum-scale=1, shrink-to-fit=no" />

        <link rel="shortcut icon" href="{{ .HostURL }}/statics/favicon.ico">
        <link href="{{ .HostURL }}/statics/css/icon.css" rel="stylesheet">
        <link href="{{ .HostURL }}/statics/css/materialize.min.css" rel="stylesheet">
        <link rel="stylesheet" href="{{ .HostURL }}/statics/css/app.css" />
        <title>{{ .PageTitle }}</title>
    </head>

    <body>
        <header>
            <nav>
                <div class="nav-wrapper">
                    <a href="{{ .HostURL }}/" class="brand-logo"><i class="material-icons">local_atm</i>InvesTool</a>
                    <a href="#" data-target="mobile-sidenav" class="sidenav-trigger"><i class="material-icons">menu</i></a>
                    <ul class="right hide-on-med-and-down">
                        <li id="nav-stock"><a href="{{ .HostURL }}/"><i class="material-icons left">trending_up</i><strong>股票</strong></a></li>
                        <li id="nav-comment"><a href="{{ .HostURL }}/comment"><i class="material-icons left">chat_bubble_outline</i><strong>感悟</strong></a></li>
                    </ul>
                </div>
            </nav>
        </header>

        <main class="container">
            {{ if .Error }}
            <div class="row">
                <div class="chip flow-text orange lighten-1 col s12 center-align">
                    {{ .Error }}
                    <i class="close material-icons">close</i>
                </div>
            </div>
            {{ end }}

            {{ end }}

            {{ define "footer" }}
        </main>

        <script src="{{ .HostURL }}/statics/js/jquery.js"></script>
        <script src="{{ .HostURL }}/statics/js/materialize.min.js"></script>
        <script src="{{ .HostURL }}/statics/js/FileSaver.min.js"></script>
        <script src="{{ .HostURL }}/statics/js/tableexport.min.js"></script>
        <script src="{{ .HostURL }}/statics/js/clipboard.min.js"></script>
        <script src="{{ .HostURL }}/statics/js/echarts.min.js"></script>

        <script type="text/javascript" src="{{ .HostURL }}/statics/js/app.js" ></script>

    </body>
</html>
{{ end }}
